name: Validate and build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install development dependencies
        working-directory: app
        run: npm ci
      - name: Install Electron runtime
        working-directory: app
        run: npm run setup
      - name: Unit and adapter tests
        working-directory: app
        run: npm test
      - name: Artifact cleanup safety
        run: ./scripts/Test-Cleanup.ps1
      - name: Check production dependency advisories
        working-directory: app
        run: npm audit --omit=dev
      - name: Desktop workflows
        working-directory: app
        run: npm run test:ui
      - name: Build client-free portable app
        env:
          UPDATE_FEED: ${{ vars.EZ_BENCH_UPDATE_FEED_URL }}
          UPDATE_PUBLIC_KEY: ${{ vars.EZ_BENCH_UPDATE_PUBLIC_KEY }}
        run: |
          if ($env:UPDATE_FEED -or $env:UPDATE_PUBLIC_KEY) {
            if (!$env:UPDATE_FEED -or !$env:UPDATE_PUBLIC_KEY) { throw 'Set both public update variables, or neither.' }
            $keyPath = Join-Path $env:RUNNER_TEMP 'ez-bench-update-public.pem'
            $env:UPDATE_PUBLIC_KEY | Set-Content -LiteralPath $keyPath -Encoding utf8
            ./scripts/Build-App.ps1 -ClientFree -UpdateFeedUrl $env:UPDATE_FEED -UpdatePublicKeyPath $keyPath
          } else { ./scripts/Build-App.ps1 -ClientFree }
      - name: Build portable archive
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/Package-App.ps1
      - name: Packaged desktop workflows
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $env:WORK_EZ_BENCH_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE "build/EZ Bench $version/EZ Bench.exe"
          Push-Location app
          try { npm run test:ui; if ($LASTEXITCODE -ne 0) { throw 'Packaged desktop tests failed.' } } finally { Pop-Location }
      - name: Compile per-user Windows installer
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/Build-Installer.ps1
      - name: Verify installer payload without executing setup
        if: github.event_name == 'workflow_dispatch'
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          ./installer/Verify-Installer.ps1 -InstallerPath "./releases/$version/EZ-Bench-Setup-$version.exe" -BuildDirectory "./build/EZ Bench $version"
      - name: Prepare clean public source
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/Prepare-GitHub.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ez-bench-windows
          path: |
            releases/**/*.zip
            releases/**/*.exe
            releases/**/*.sha256
            releases/**/*.exe.json
          if-no-files-found: error
          retention-days: 14
